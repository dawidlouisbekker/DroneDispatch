# MEC zone sea-north. Its own JetStream domain buffers missions and telemetry
# while the uplink (through toxiproxy) is down.
server_name: leaf-sea-north
port: 4222
http_port: 8222

jetstream {
  domain: sea-north
  store_dir: /data/jetstream
}

leafnodes {
  remotes: [
    { url: "nats-leaf://toxiproxy:7423" }
  ]
}
