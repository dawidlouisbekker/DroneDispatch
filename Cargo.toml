[workspace]
resolver = "3"
members = ["crates/*", "services/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
# Shared crates
contracts = { path = "crates/contracts" }
geo = { path = "crates/geo" }
station = { path = "crates/station" }
svc-auth = { path = "crates/svc-auth" }
svc-common = { path = "crates/svc-common" }

# Runtime and HTTP
tokio = { version = "1.53", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }

# Access tokens (crates/svc-auth verifies, auth-service signs)
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

# auth-service: passwords, sessions, MFA. Versions match what jsonwebtoken already pulls in.
argon2 = "0.5"
axum-extra = { version = "0.12", features = ["cookie"] }
base64 = "0.22"
p256 = { version = "0.13", features = ["pkcs8", "pem", "jwk"] }
rand = "0.9"
sha2 = "0.10"
url = "2"
webauthn-rs = { version = "0.5.4", features = ["danger-allow-state-serialisation", "conditional-ui"] }

# Messaging and storage
async-nats = "0.50"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "time"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

# gRPC and protobuf (crates/contracts)
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
prost = "0.14"
prost-types = "0.14"
protox = "0.9.1"

# MCP (user-service)
rmcp = { version = "3.3", features = ["server", "macros", "transport-streamable-http-server"] }

# Serialization, errors, observability
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }
