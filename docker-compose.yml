# Local Drone Drop stack: shared infrastructure, the three cloud services (auth,
# user, merchant), and two simulated MEC edge zones. Each zone runs
# catalog-read-service and dispatch-service behind its own NATS leaf, whose uplink
# runs through toxiproxy. Locally the zones share the Postgres container (one
# database per zone); in a real MEC deployment each zone runs its own.
name: drone-drop

x-cloud-service: &cloud-service
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    nats-hub: { condition: service_started }

services:
  # --- Infrastructure --------------------------------------------------------
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15

  nats-hub:
    image: nats:2.12
    command: ["-c", "/etc/nats/hub.conf"]
    volumes:
      - ./config/nats/hub.conf:/etc/nats/hub.conf:ro
      - nats-hub-data:/data
    ports: ["4222:4222", "8222:8222"]

  # Sits on each edge zone's uplink so scripts/ can inject latency and partitions.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./config/toxiproxy.json:/config/toxiproxy.json:ro
    ports: ["8474:8474"]
    depends_on: [nats-hub]

  nats-leaf-sea-north:
    image: nats:2.12
    command: ["-c", "/etc/nats/leaf.conf"]
    volumes:
      - ./config/nats/leaf-sea-north.conf:/etc/nats/leaf.conf:ro
    ports: ["4223:4222"]
    depends_on: [toxiproxy]

  nats-leaf-sea-south:
    image: nats:2.12
    command: ["-c", "/etc/nats/leaf.conf"]
    volumes:
      - ./config/nats/leaf-sea-south.conf:/etc/nats/leaf.conf:ro
    ports: ["4224:4222"]
    depends_on: [toxiproxy]

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

  # Optional: docker compose --profile stripe up stripe-cli
  stripe-cli:
    image: stripe/stripe-cli
    profiles: [stripe]
    # Event lists and why: EXTERNAL_CLOUD_SERVICES_SETUP.md, "Webhooks".
    command:
      - "listen"
      - "--api-key=${STRIPE_SECRET_KEY:-}"
      - "--events=payment_intent.amount_capturable_updated,payment_intent.succeeded,payment_intent.payment_failed,payment_intent.canceled,charge.refunded,refund.updated,checkout.session.completed"
      - "--forward-to=http://user-service:8085/webhooks/stripe"
      - "--thin-events=v2.core.account[requirements].updated,v2.core.account[configuration.recipient].capability_status_updated,v2.core.account_link.returned"
      - "--forward-thin-to=http://merchant-service:8083/webhooks/stripe/thin"

  # --- Cloud services --------------------------------------------------------
  auth-service:
    <<: *cloud-service
    build: { context: ., args: { SERVICE: auth-service } }
    environment:
      HTTP_ADDR: 0.0.0.0:8081
      DATABASE_URL: postgres://auth:auth@postgres:5432/auth
      NATS_URL: nats://nats-hub:4222
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: "Drone Drop <no-reply@dronedrop.local>"
      MCP_RESOURCE_URL: ${USER_PUBLIC_URL:-http://localhost:8085}/mcp
      AUTH_SIGNING_KEY_FILE: /run/auth/auth-signing-key.pem
    volumes:
      - ./services/auth-service/auth-signing-key.pem:/run/auth/auth-signing-key.pem:ro
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      nats-hub: { condition: service_started }
      mailpit: { condition: service_started }

  user-service:
    <<: *cloud-service
    build: { context: ., args: { SERVICE: user-service } }
    environment:
      HTTP_ADDR: 0.0.0.0:8085
      DATABASE_URL: postgres://user_service:user_service@postgres:5432/user_service
      NATS_URL: nats://nats-hub:4222
      API_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8086}/api/user
      MCP_PUBLIC_URL: ${USER_PUBLIC_URL:-http://localhost:8085}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8081}
      AUTH_JWKS_URL: http://auth-service:8081/.well-known/jwks.json
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports: ["8085:8085"]

  merchant-service:
    <<: *cloud-service
    build: { context: ., args: { SERVICE: merchant-service } }
    environment:
      HTTP_ADDR: 0.0.0.0:8083
      DATABASE_URL: postgres://merchant:merchant@postgres:5432/merchant
      NATS_URL: nats://nats-hub:4222
      API_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8086}/api/merchant
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8081}
      AUTH_JWKS_URL: http://auth-service:8081/.well-known/jwks.json
    ports: ["8083:8083"]

  # One origin for ui/app: the web build plus /api/user, /api/merchant and /api/catalog
  # (config/caddy/Caddyfile). The app folder is mounted rather than dist/, so Docker never
  # creates dist/ as root.
  ui-gateway:
    image: caddy:2
    restart: unless-stopped
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./ui/app:/srv/app:ro
    ports: ["8086:8086"]
    depends_on: [user-service, merchant-service, catalog-read-sea-north]

  # --- MEC edge zones --------------------------------------------------------
  catalog-read-sea-north:
    build: { context: ., args: { SERVICE: catalog-read-service } }
    restart: unless-stopped
    environment:
      EDGE_ZONE: sea-north
      HTTP_ADDR: 0.0.0.0:8084
      DATABASE_URL: postgres://catalog_read:catalog_read@postgres:5432/catalog_read_sea_north
      NATS_URL: nats://nats-leaf-sea-north:4222
    ports: ["8084:8084"]
    depends_on:
      postgres: { condition: service_healthy }
      nats-leaf-sea-north: { condition: service_started }

  catalog-read-sea-south:
    build: { context: ., args: { SERVICE: catalog-read-service } }
    restart: unless-stopped
    environment:
      EDGE_ZONE: sea-south
      HTTP_ADDR: 0.0.0.0:8084
      DATABASE_URL: postgres://catalog_read:catalog_read@postgres:5432/catalog_read_sea_south
      NATS_URL: nats://nats-leaf-sea-south:4222
    ports: ["8094:8084"]
    depends_on:
      postgres: { condition: service_healthy }
      nats-leaf-sea-south: { condition: service_started }

  dispatch-sea-north:
    build: { context: ., args: { SERVICE: dispatch-service } }
    restart: unless-stopped
    environment:
      EDGE_ZONE: sea-north
      HTTP_ADDR: 0.0.0.0:8082
      DATABASE_URL: postgres://dispatch:dispatch@postgres:5432/dispatch_sea_north
      NATS_URL: nats://nats-leaf-sea-north:4222
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      nats-leaf-sea-north: { condition: service_started }

  dispatch-sea-south:
    build: { context: ., args: { SERVICE: dispatch-service } }
    restart: unless-stopped
    environment:
      EDGE_ZONE: sea-south
      HTTP_ADDR: 0.0.0.0:8082
      DATABASE_URL: postgres://dispatch:dispatch@postgres:5432/dispatch_sea_south
      NATS_URL: nats://nats-leaf-sea-south:4222
    ports: ["8092:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      nats-leaf-sea-south: { condition: service_started }

volumes:
  postgres-data:
  nats-hub-data:
