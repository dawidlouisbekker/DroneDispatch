// dispatch-service internal API. One instance runs in each edge zone and owns that zone's
// drone fleet. Commands arrive over NATS (fleet_events.proto), so they queue while a zone is
// cut off; these RPCs are reads for the live map.
syntax = "proto3";

package dronedrop.dispatch.v1;

import "dronedrop/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

service Fleet {
  // The zone's drones with their latest known state, for the live map.
  // Callers: user.
  rpc GetFleetSnapshot(GetFleetSnapshotRequest) returns (GetFleetSnapshotResponse);

  // Callers: user.
  // Errors: NOT_FOUND (MISSION_NOT_FOUND).
  rpc GetMission(GetMissionRequest) returns (GetMissionResponse);
}

// Flight states of the simulator.
enum DroneState {
  DRONE_STATE_UNSPECIFIED = 0;
  DRONE_STATE_IDLE = 1;
  DRONE_STATE_TAKEOFF = 2;
  DRONE_STATE_TO_PICKUP = 3;
  // Near a station, scanning its access networks.
  DRONE_STATE_APPROACH = 4;
  // Authenticating the station over mutual TLS.
  DRONE_STATE_HANDSHAKE = 5;
  DRONE_STATE_LOADING = 6;
  DRONE_STATE_TO_DROPOFF = 7;
  DRONE_STATE_DROPOFF = 8;
  DRONE_STATE_RETURNING = 9;
  DRONE_STATE_CHARGING = 10;
  DRONE_STATE_OUT_OF_SERVICE = 11;
}

enum MissionState {
  MISSION_STATE_UNSPECIFIED = 0;
  // dispatch request received; looking for a drone.
  MISSION_STATE_REQUESTED = 1;
  MISSION_STATE_ASSIGNED = 2;
  MISSION_STATE_AT_PICKUP = 3;
  MISSION_STATE_PICKED_UP = 4;
  MISSION_STATE_AT_DROPOFF = 5;
  MISSION_STATE_DELIVERED = 6;
  // A station could not be authenticated.
  MISSION_STATE_STATION_FAILED = 7;
  MISSION_STATE_ABORTED = 8;
  // No drone became free within 10 minutes.
  MISSION_STATE_NO_DRONE = 9;
  MISSION_STATE_RECALLED = 10;
}

// One telemetry sample: 10 Hz on tlm.raw.<zone>.<drone> inside the zone, downsampled to
// 1 Hz in the TELEMETRY stream that syncs to the hub.
message Telemetry {
  string zone = 1;
  string drone_id = 2;
  DroneState state = 3;
  dronedrop.common.v1.LatLon position = 4;
  float alt_m = 5;
  float heading_deg = 6;
  float speed_mps = 7;
  float battery_pct = 8;
  // Empty when the drone has no mission.
  string order_id = 9;
  google.protobuf.Timestamp at = 10;
}

message Mission {
  // user-service orders.id. One mission per order.
  string order_id = 1;
  MissionState state = 2;
  string zone = 3;
  // Empty until assigned.
  string drone_id = 4;
  string pickup_station_id = 5;
  dronedrop.common.v1.LatLon pickup = 6;
  string dropoff_station_id = 7;
  dronedrop.common.v1.LatLon dropoff = 8;
  int32 payload_g = 9;
  // Assignment attempts so far.
  int32 attempts = 10;
  // Seconds until delivery, when known.
  int32 eta_seconds = 11;
  google.protobuf.Timestamp requested_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message GetFleetSnapshotRequest {}

message GetFleetSnapshotResponse {
  // e.g. "sea-north".
  string zone = 1;
  // False while the zone's uplink to the hub is down.
  bool uplink_connected = 2;
  // Latest telemetry sample per drone.
  repeated Telemetry drones = 3;
}

message GetMissionRequest {
  string order_id = 1;
}

message GetMissionResponse {
  Mission mission = 1;
}
