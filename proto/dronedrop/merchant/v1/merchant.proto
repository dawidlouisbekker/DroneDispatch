// merchant-service internal API: the write side for businesses. user-service uses it to
// price and submit orders; businesses manage their catalog through the merchant HTTP API.
// Catalog reads are served by catalog-read-service (catalog.proto).
syntax = "proto3";

package dronedrop.merchant.v1;

import "dronedrop/common/v1/common.proto";
import "dronedrop/station/v1/station.proto";
import "google/protobuf/timestamp.proto";

// The business side of an order.
service Fulfilment {
  // Authoritative prices, weights and stock for a cart. Holds nothing.
  // Callers: user.
  // Errors: NOT_FOUND (CATALOG_NOT_FOUND, ITEM_NOT_FOUND),
  // FAILED_PRECONDITION (MERCHANT_NOT_ACCEPTING, OUT_OF_STOCK, OVER_PAYLOAD_LIMIT).
  rpc PriceOrder(PriceOrderRequest) returns (PriceOrderResponse);

  // Reserves stock and puts the order on the business's board with its accept window.
  // Idempotent on order_id.
  // Callers: user.
  // Errors: as PriceOrder, plus FAILED_PRECONDITION (PRICE_CHANGED, NO_ACTIVE_STATION).
  rpc SubmitOrder(SubmitOrderRequest) returns (SubmitOrderResponse);

  // Releases stock and takes the order off the board, before it is loaded. Idempotent on order_id.
  // Callers: user.
  // Errors: FAILED_PRECONDITION (ALREADY_LOADED), NOT_FOUND (ORDER_NOT_FOUND).
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
}

enum BusinessStatus {
  BUSINESS_STATUS_UNSPECIFIED = 0;
  // Registered but not yet approved for orders.
  BUSINESS_STATUS_PENDING = 1;
  BUSINESS_STATUS_ACTIVE = 2;
  BUSINESS_STATUS_SUSPENDED = 3;
}

enum FulfilmentStatus {
  FULFILMENT_STATUS_UNSPECIFIED = 0;
  FULFILMENT_STATUS_AWAITING_DECISION = 1;
  FULFILMENT_STATUS_ACCEPTED = 2;
  FULFILMENT_STATUS_REJECTED = 3;
  // The business didn't decide within the accept window.
  FULFILMENT_STATUS_EXPIRED = 4;
  FULFILMENT_STATUS_CANCELLED = 5;
  // Handed to the drone at the business station.
  FULFILMENT_STATUS_LOADED = 6;
}

message OrderLine {
  // menu_items.id.
  string item_id = 1;
  int32 qty = 2;
}

// A line with authoritative values, copied into the customer's order.
message PricedLine {
  string item_id = 1;
  string name = 2;
  // What Alexa+ reads out.
  string spoken_name = 3;
  dronedrop.common.v1.Money unit_price = 4;
  int32 qty = 5;
  // Weight of one unit.
  int32 weight_g = 6;
}

message PriceOrderRequest {
  // The catalog's Amazon Location place ID.
  string place_id = 1;
  repeated OrderLine lines = 2;
}

message PriceOrderResponse {
  string business_id = 1;
  string spoken_name = 2;
  repeated PricedLine lines = 3;
  dronedrop.common.v1.Money subtotal = 4;
  // Total weight; the drone limit is 2500 g.
  int32 payload_g = 5;
  int32 prep_time_minutes = 6;
}

message SubmitOrderRequest {
  // user-service orders.id.
  string order_id = 1;
  string customer_sub = 2;
  string place_id = 3;
  // The lines from PriceOrder. A price that changed since then is rejected (PRICE_CHANGED).
  repeated PricedLine lines = 4;
  dronedrop.common.v1.Money subtotal = 5;
}

message SubmitOrderResponse {
  FulfilmentStatus status = 1;
  // The business must accept by this time.
  google.protobuf.Timestamp accept_by = 2;
  // The business station the drone collects the order from.
  dronedrop.station.v1.Station pickup_station = 3;
}

message CancelOrderRequest {
  string order_id = 1;
  string reason = 2;
}

message CancelOrderResponse {
  FulfilmentStatus status = 1;
}
